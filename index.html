<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1> Student Study Tracker</h1>
        <p>Track your learning. Stay Consistent</p>
    </header>

    <main>
        <div class="card">
            <h2>Today's progression</h2>
            <p>0 Hours studied</p>
            <div class="progression">
                <p>Study time : 3/5 hours</p>
                <p class="txt">60% completed</p>
            </div>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

        </div>

        <div class="card">
            <h2>My subjects</h2>
            <div class="subjects">
                <div class="dbms">
                    <div class="subject-progression">
                        <p>DBMS</p>
                        <p>40% completed</p>
                    </div>

                    <div class="progress-bar">
                       
                            <div class = "progress dbms-width"></div>
                        
                    </div>
                </div>

                <div class="dsa">
                    <div class="subject-progression">
                        <p>DSA</p>
                        <p>75% completed</p>
                    </div>
                    <div class="progress-bar">
                        
                            <div class = "progress dsa-width"></div>
                        
                    </div>


                </div>

                <div class="os">
                    <div class="subject-progression">
                        <p>OS</p>
                        <p>20% completed</p>
                    </div>
                    <div class="progress-bar">
                       
                            <div class = "progress os-width"></div>
                        
                    </div>
                </div>

                <div class = "cn">
                    <div class = "subject-progression">
                        <p>CN</p>
                        <p>30% completed</p>
                    </div>
                    <div class = "progress-bar">
                        <div class = "progress cn-width"></div>
                    </div>
                </div>

                
                <div class ="java">
                    <div class = "subject-progression">
                        <p>JAVA</p>
                        <p>50% completed</p>
                    </div>
                    <div class = "progress-bar">
                        <div class = "progress java-width"></div>
                    </div>

                </div>

            </div>



        </div>
        </div>
    </main>

</body>

</html>
